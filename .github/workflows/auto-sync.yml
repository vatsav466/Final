name: Auto PR and Merge

on:
  push:
    branches:
      - frontend
      - backend

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create PR if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=${GITHUB_REF_NAME}

          PR=$(gh pr list \
            --base main \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH into main" \
              --body "Automatically created by GitHub Actions"

            PR=$(gh pr list \
              --base main \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number')
          fi

          gh pr merge "$PR" \
            --merge \
            --auto
