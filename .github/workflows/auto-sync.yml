name: Auto Sync Frontend/Backend to Main

on:
  push:
    branches:
      - frontend
      - backend

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge branch into main
        run: |
          # Ensure local main is up-to-date
          git fetch origin main:${{ github.ref_name }}
          git checkout main
          git pull origin main

          # Merge the triggering branch into main
          git merge "origin/${{ github.ref_name }}" --no-edit -m "ci: auto-merge ${{ github.ref_name }} into main"

          # Push changes back to main
          git push origin main
