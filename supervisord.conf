[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Full backend aggregator - this is what serves /docs, /redoc, /openapi.json
; and /api/*. It auto-discovers every "router = APIRouter()" it finds by
; walking its working directory, which is why WorkingDirectory MUST be
; api_manager (same as the ceg_api@.service systemd unit in production) -
; that folder holds ~65 route modules (LPG ops, tank inventory, TAS
; analytics, dealer management, alerts, roles, dashboards, etc). Running it
; via "python3 -m urdhva_base" (not bare uvicorn) matters: urdhva_base's
; __main__.py does sys.path.append(os.getcwd()) before starting uvicorn,
; which is required for its flat-file router modules to import correctly.
[program:urdhva_api]
directory=/app/backend/api_manager
environment=PORT="8001",MODE="prod"
command=python3 -m urdhva_base
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Cache gateway - narrow, separate service, only /api_cache/* endpoints
[program:cache_api]
directory=/app/backend
command=uvicorn cache_gateway.cache_api_actions:app --host 0.0.0.0 --port 8002
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:opc_simulator]
directory=/app/backend/Agents/OpcDataSimulator
command=python3 opc_data_simulator.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:opcua_agent]
directory=/app/backend/Agents/opcua agent
command=python3 opuaagent_new.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:oracle_agent]
directory=/app/backend/Agents/oracle_db
command=python3 oracleagent.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbitmq_consumer]
directory=/app/backend/Agents/oracle_db
command=python3 rabbitmq_consumer.py
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
