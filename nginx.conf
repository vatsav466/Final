# =====================================================================
# nginx.conf  ->  save at REPO ROOT (next to the root Dockerfile)
# =====================================================================
# NOTE: this is for the SINGLE combined image (root Dockerfile +
# supervisord running nginx + backend together in one container).
# Here 127.0.0.1 is correct, because nginx and the backend process are
# both inside the same container - unlike the two-container/
# docker-compose setup, where "backend" (the service name) had to be
# used instead of localhost.

server {
    listen 5378;
    server_name localhost;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React (Vite) app; fall back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Digital twin model assets
    location /digitaltwin-images/ {
        alias /opt/digitaltwin_images/;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";

        types {
            model/gltf-binary glb;
        }
    }

    # All business API routes are mounted under /api by the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_buffers 8 1024k;
        proxy_buffer_size 1024k;
    }

    # FastAPI's built-in interactive docs (mounted at root by FastAPI,
    # not under /api) - this is what your deploy step checks at
    # http://<server>:5378/docs
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    error_page 502 /custom_502.html;
    location = /custom_502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
